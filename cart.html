<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart - Chipso Snaxx</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="apple-touch-icon" href="logo.jpg">

<!-- Modern Google Fonts (Fredoka + Poppins + Outfit) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@300;400;600;800&family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
:root { 
    --bg-light: #fffdfa;
    --bg-secondary: #fff7ed;
    --card-bg: #ffffff;
    --card-border: rgba(245, 158, 11, 0.15);
    --text-main: #1f2937;
    --text-sub: #4b5563;
    
    /* Yellow, Orange & Dark Slate Accents */
    --primary-orange: #f97316;
    --primary-yellow: #eab308;
    --dark-heading: #1e293b;
    --accent-red: #ef4444;
    
    /* Dark Slate Blue Theme */
    --nav-contact-bg: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    
    --btn-gradient: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
    --btn-hover: linear-gradient(135deg, #fbbf24 0%, #f97316 100%);
    --glow-shadow: 0 10px 25px rgba(234, 88, 12, 0.25);
}

body { 
    font-family: 'Outfit', 'Poppins', sans-serif; 
    margin:0; 
    background-color: var(--bg-light);
    color: var(--text-main);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
}

/* Subtle background glow blurs */
body::before {
    content: '';
    position: absolute;
    top: 5%;
    left: -10%;
    width: 450px;
    height: 450px;
    background: #fef08a;
    filter: blur(160px);
    opacity: 0.6;
    z-index: -1;
    border-radius: 50%;
}

body::after {
    content: '';
    position: absolute;
    top: 50%;
    right: -10%;
    width: 500px;
    height: 500px;
    background: #ffedd5;
    filter: blur(180px);
    opacity: 0.7;
    z-index: -1;
    border-radius: 50%;
}

/* --- HEADER --- */
header { 
    background: var(--nav-contact-bg);
    border-bottom: 3px solid var(--primary-orange);
    padding: 18px 20px; 
    text-align: center; 
    font-size: 1.3rem; 
    font-weight: 800; 
    letter-spacing: 0.5px;
    position: relative;
    color: #ffffff;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
}

.back-btn {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255, 255, 255, 0.12);
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 8px 14px;
    border-radius: 50px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    gap: 4px;
}

.back-btn:hover { 
    background: var(--primary-orange); 
    color: white; 
    border-color: transparent;
}

h2 { 
    text-align: center; 
    margin-top: 30px; 
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--dark-heading); 
}

/* Table Container (Responsive Scroll Enabled) */
.table-container { 
    width: 94%; 
    max-width: 950px; 
    margin: 20px auto; 
    background: var(--card-bg); 
    border-radius: 18px; 
    box-shadow: 0 10px 30px rgba(245, 158, 11, 0.08); 
    overflow-x: auto; 
    border: 1px solid var(--card-border);
    -webkit-overflow-scrolling: touch;
}

table { width: 100%; border-collapse: collapse; min-width: 420px; }
th, td { padding: 14px 12px; text-align: center; border-bottom: 1px solid var(--card-border); }

/* --- TH DARK SLATE BLUE THEME --- */
th { 
    background: var(--nav-contact-bg); 
    font-weight: 700; 
    color: #ffffff; 
    text-transform: uppercase; 
    font-size: 0.8rem; 
    letter-spacing: 0.8px;
    border-bottom: 2px solid var(--primary-orange);
}

.product-cell { display: flex; align-items: center; gap: 10px; text-align: left; }
.cart-img { width: 45px; height: 45px; object-fit: cover; border-radius: 10px; box-shadow: 0 3px 8px rgba(0,0,0,0.06); }
.product-cell span { font-weight: 600; color: var(--dark-heading); font-size: 0.9rem; }

/* Light Quantity Controls */
.qty-controls-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff7ed;
    padding: 4px 8px;
    border-radius: 50px;
    width: fit-content;
    margin: 0 auto;
    border: 1px solid rgba(249, 115, 22, 0.2);
}

.qty-btn { 
    background: #ffffff; 
    border: 1px solid rgba(249, 115, 22, 0.3); 
    width: 26px; 
    height: 26px; 
    cursor: pointer; 
    border-radius: 50%; 
    font-weight: bold; 
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--primary-orange);
    transition: all 0.2s ease;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

.qty-btn:hover { background: var(--primary-orange); color: white; border-color: var(--primary-orange); }
.qty-val { margin: 0 8px; font-weight: 700; font-size: 0.9rem; color: var(--dark-heading); }

.remove-btn { 
    background: #fef2f2; 
    color: var(--accent-red); 
    border: 1px solid #fecaca; 
    padding: 6px 10px; 
    border-radius: 50px; 
    cursor: pointer; 
    font-weight: 600;
    font-size: 0.8rem;
    transition: all 0.2s ease;
}

.remove-btn:hover { background: var(--accent-red); color: #fff; border-color: var(--accent-red); }

.total-section { 
    text-align: center; 
    font-size: 24px; 
    margin: 30px 20px 15px 20px; 
    font-weight: 800; 
    color: var(--primary-orange); 
}

/* Premium Gradient Button */
.btn { 
    display: block; 
    margin: 20px auto 40px; 
    padding: 16px 40px; 
    background: var(--btn-gradient); 
    color: #fff;
    border: none; 
    border-radius: 50px; 
    cursor: pointer; 
    font-weight: 800; 
    font-size: 1.1rem; 
    text-transform: uppercase;
    letter-spacing: 0.8px;
    box-shadow: var(--glow-shadow);
    transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); 
    width: 88%;
    max-width: 360px;
}

.btn:hover { 
    background: var(--btn-hover); 
    transform: translateY(-3px); 
    box-shadow: 0 15px 35px rgba(234, 88, 12, 0.45);
}

@media (max-width: 600px) { 
    header { 
        font-size: 1.1rem; 
        padding: 16px 10px; 
        justify-content: flex-end; 
        padding-right: 20px;
    } 
    .back-btn {
        left: 10px;
        padding: 6px 14px;
        font-size: 0.85rem;
    }
    .table-container { 
        width: 98%; 
        margin: 15px auto; 
    }
    
    /* Table Header & Cell Padding / Font Size Kootiyiyath */
    th, td { 
        padding: 14px 10px; 
        font-size: 0.95rem; 
    }
    th {
        font-size: 0.88rem;
    }

    /* Product Image & Text Size Adjustment */
    .cart-img { 
        width: 52px; 
        height: 52px; 
        border-radius: 10px;
    }
    .product-cell span { 
        font-size: 0.95rem; 
        font-weight: 700;
    }

    /* Quantity Controls Size Adjustment */
    .qty-controls-wrapper {
        padding: 6px 10px;
    }
    .qty-btn { 
        width: 30px; 
        height: 30px; 
        font-size: 1rem; 
    }
    .qty-val { 
        margin: 0 10px; 
        font-size: 1rem; 
    }

    /* Remove Button Size */
    .remove-btn { 
        padding: 8px 12px; 
        font-size: 0.9rem; 
    }

    .total-section { font-size: 22px; }
}
</style>
</head>
<body>

<header>
    <button onclick="goBack()" class="back-btn">← Back</button>
    <span>Chipso Snaxx Cart 🛒</span>
</header>

<h2>Your Items</h2>

<div class="table-container">
<table id="cartTable">
<thead>
    <tr>
    <th style="text-align: left; padding-left: 15px;">Product</th>
    <th>Price</th>
    <th>Qty</th>
    <th>Remove</th>
    </tr>
</thead>
<tbody id="cartBody"></tbody>
</table>
</div>

<div class="total-section" id="grandTotal">Total: ₹0</div>
<button class="btn" onclick="goToOrder()">Place Order Now</button>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function loadCart(){
    let tableBody = document.getElementById("cartBody");
    tableBody.innerHTML = "";
    let total = 0;

    if(cart.length === 0) {
        tableBody.innerHTML = "<tr><td colspan='4' style='padding:40px; color: var(--text-sub); font-weight:500;'>Your cart is empty!</td></tr>";
        document.getElementById("grandTotal").innerText = "Total: ₹0";
        return;
    }

    cart.forEach((item, index) => {
        // Enforce minimum 5 packets on initial cart load
        if (!item.qty || item.qty < 5) {
            item.qty = 5;
        }

        let row = tableBody.insertRow();
        row.innerHTML = `
        <td>
            <div class="product-cell" style="padding-left: 5px;">
                <img src="${item.img}" class="cart-img">
                <span>${item.name}</span>
            </div>
        </td>
        <td style="font-weight: 700; color: var(--primary-orange);">₹${item.price}</td>
        <td>
            <div class="qty-controls-wrapper">
                <button class="qty-btn" onclick="updateQty(${index}, -1)">-</button>
                <span class="qty-val">${item.qty}</span>
                <button class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
            </div>
        </td>
        <td>
            <button class="remove-btn" onclick="removeItem(${index})">✕</button>
        </td>
        `;
        total += item.price * item.qty;
    });

    localStorage.setItem("cart", JSON.stringify(cart));
    document.getElementById("grandTotal").innerText = "Total: ₹" + total;
}

function updateQty(index, change) {
    // 5-ൽ താഴെ ആകാൻ ശ്രമിച്ചാൽ തടയുന്നു (മിനിമം ക്വാണ്ടിറ്റി 5)
    if (cart[index].qty + change < 5) {
        alert("Minimum order quantity is 5 packets!");
        return;
    }
    
    cart[index].qty += change;
    saveAndReload();
}

function removeItem(index){
    if(confirm("Remove this item?")) {
        cart.splice(index, 1);
        saveAndReload();
    }
}

function saveAndReload() {
    localStorage.setItem("cart", JSON.stringify(cart));
    loadCart();
}

function goToOrder(){
    if(!cart || cart.length === 0) {
        alert("Your cart is empty!");
        return;
    }
    
    let summary = cart.map(item => {
        let quantity = item.qty || 5;
        return `${item.name} x ${quantity}`;
    }).join(", ");

    let totalAmount = cart.reduce((sum, item) => sum + (Number(item.price) * Number(item.qty)), 0);

    localStorage.setItem("fullOrderSummary", summary);
    localStorage.setItem("totalOrderAmount", totalAmount);

    window.location.href = "orderchipso.html";
}

function goBack(){
    window.history.back();
}

loadCart();
</script>
</body>
</html>
