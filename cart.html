<style>
:root { 
    --bg-light: #fffdfa;
    --bg-secondary: #fff7ed;
    --card-bg: #ffffff;
    --card-border: rgba(245, 158, 11, 0.15);
    --text-main: #1f2937;
    --text-sub: #4b5563;
    --primary-orange: #f97316;
    --primary-yellow: #eab308;
    --dark-heading: #1e293b;
    --accent-red: #ef4444;
    --nav-contact-bg: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    --btn-gradient: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
    --btn-hover: linear-gradient(135deg, #fbbf24 0%, #f97316 100%);
    --glow-shadow: 0 10px 25px rgba(234, 88, 12, 0.25);
}

body { 
    font-family: 'Outfit', 'Poppins', sans-serif; 
    margin:0; 
    background-color: var(--bg-light);
    color: var(--text-main);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
}

body::before {
    content: '';
    position: absolute;
    top: 5%; left: -10%;
    width: 450px; height: 450px;
    background: #fef08a;
    filter: blur(160px);
    opacity: 0.6;
    z-index: -1;
    border-radius: 50%;
}

body::after {
    content: '';
    position: absolute;
    top: 50%; right: -10%;
    width: 500px; height: 500px;
    background: #ffedd5;
    filter: blur(180px);
    opacity: 0.7;
    z-index: -1;
    border-radius: 50%;
}

header { 
    background: var(--nav-contact-bg);
    border-bottom: 3px solid var(--primary-orange);
    padding: 18px 20px; 
    text-align: center; 
    font-size: 1.3rem; 
    font-weight: 800; 
    letter-spacing: 0.5px;
    position: relative;
    color: #ffffff;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
}

.back-btn {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255, 255, 255, 0.12);
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 8px 14px;
    border-radius: 50px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    gap: 4px;
}

.back-btn:hover { 
    background: var(--primary-orange); 
    color: white; 
    border-color: transparent;
}

h2 { 
    text-align: center; 
    margin-top: 30px; 
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--dark-heading); 
}

.table-container { 
    width: 94%; 
    max-width: 950px; 
    margin: 20px auto; 
    background: var(--card-bg); 
    border-radius: 18px; 
    box-shadow: 0 10px 30px rgba(245, 158, 11, 0.08); 
    overflow-x: auto; 
    border: 1px solid var(--card-border);
}

table { width: 100%; border-collapse: collapse; min-width: 420px; }
th, td { padding: 14px 12px; text-align: center; border-bottom: 1px solid var(--card-border); }

th { 
    background: var(--nav-contact-bg); 
    font-weight: 700; 
    color: #ffffff; 
    text-transform: uppercase; 
    font-size: 0.8rem; 
    letter-spacing: 0.8px;
    border-bottom: 2px solid var(--primary-orange);
}

.product-cell { display: flex; align-items: center; gap: 10px; text-align: left; }
.cart-img { width: 45px; height: 45px; object-fit: cover; border-radius: 10px; }
.product-cell span { font-weight: 600; color: var(--dark-heading); font-size: 0.9rem; }

.qty-controls-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff7ed;
    padding: 4px 8px;
    border-radius: 50px;
    width: fit-content;
    margin: 0 auto;
    border: 1px solid rgba(249, 115, 22, 0.2);
}

.qty-btn { 
    background: #ffffff; 
    border: 1px solid rgba(249, 115, 22, 0.3); 
    width: 26px; height: 26px; 
    cursor: pointer; 
    border-radius: 50%; 
    font-weight: bold; 
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--primary-orange);
}

.qty-btn:hover { background: var(--primary-orange); color: white; }
.qty-val { margin: 0 8px; font-weight: 700; font-size: 0.9rem; }

.remove-btn { 
    background: #fef2f2; 
    color: var(--accent-red); 
    border: 1px solid #fecaca; 
    padding: 6px 10px; 
    border-radius: 50px; 
    cursor: pointer; 
    font-weight: 600;
    font-size: 0.8rem;
}
.ai-chat-btn {
            position: fixed; bottom: 80px; right: 25px;
            background: linear-gradient(135deg, #111827 0%, #172554 55%, #0b132b 100%);
            color: #ffffff; border-radius: 999px; padding: 10px 20px 10px 11px;
            font-weight: 800; letter-spacing: .2px;
            border: 1px solid rgba(255, 205, 48, .85); cursor: pointer;
            box-shadow: 0 9px 28px rgba(3, 7, 18, .34), 0 0 0 3px rgba(255, 193, 7, .10), 0 0 24px rgba(255, 174, 0, .20);
            display: flex; align-items: center; gap: 12px; z-index: 1001; font-size: .96rem;
            transition: transform .25s ease, box-shadow .25s ease;
        }
        .ai-chat-btn > span:last-child {
            background: linear-gradient(90deg, #fff7c2, #ffc928 55%, #fff0a3);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            text-shadow: 0 1px 12px rgba(255, 194, 30, .12);
        }
        .ai-chat-btn:hover {
            transform: translateY(-3px) scale(1.025);
            box-shadow: 0 14px 34px rgba(3, 7, 18, .4), 0 0 0 4px rgba(255, 193, 7, .13), 0 0 30px rgba(255, 174, 0, .28);
        }
        .ai-chat-btn:focus-visible { outline: 3px solid #fbbf24; outline-offset: 4px; }

        .ai-chat-window {
            position: fixed; bottom: 140px; right: 25px;
            width: 380px; max-width: 92vw; height: 540px;
            background: var(--slate-bg); border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(56, 189, 248, 0.3); z-index: 1002;
            display: none; flex-direction: column; overflow: hidden;
            backdrop-filter: blur(10px);
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

.remove-btn:hover { background: var(--accent-red); color: #fff; }

.total-section { 
    text-align: center; 
    font-size: 24px; 
    margin: 30px 20px 15px 20px; 
    font-weight: 800; 
    color: var(--primary-orange); 
}

.btn { 
    display: block; 
    margin: 20px auto 40px; 
    padding: 16px 40px; 
    background: var(--btn-gradient); 
    color: #fff;
    border: none; 
    border-radius: 50px; 
    cursor: pointer; 
    font-weight: 800; 
    font-size: 1.1rem; 
    text-transform: uppercase;
    letter-spacing: 0.8px;
    box-shadow: var(--glow-shadow);
    width: 88%;
    max-width: 360px;
}

.btn:hover { 
    background: var(--btn-hover); 
    transform: translateY(-3px); 
}

@media (max-width: 600px) { 
    header { font-size: 1.1rem; padding: 16px 10px; }
    .table-container { width: 98%; }
    th, td { padding: 14px 10px; font-size: 0.95rem; }
    .cart-img { width: 52px; height: 52px; }
    .qty-btn { width: 30px; height: 30px; }
    .total-section { font-size: 22px; }
}

}

        @keyframes slideUp {

        /* Premium CSS-drawn Chipso chef mascot — no image/video file required */
        .chef-code-avatar {
            position: relative;

            border: 1px solid rgba(255,255,255,.9);
            box-shadow: inset 4px 5px 8px rgba(255,255,255,.52), inset -6px -8px 9px rgba(204,102,0,.22), 0 5px 13px rgba(0,0,0,.23), 0 0 0 3px rgba(255,205,48,.12);

        }
        .chef-code-avatar::before {

        .chef-code-hat {
            position: absolute; z-index: 3;

        .chef-code-hat::before, .chef-code-hat::after {

        .chef-code-letter {

        }
        .chef-code-eye {
            position: absolute; z-index: 2; top: 26px; width: 12px; height: 17px;
            background: radial-gradient(ellipse at 35% 25%, #fff 0 10%, #fff 12%, #321a12 20%, #160c09 78%);

            box-shadow: 0 1px 2px rgba(80,40,0,.25), inset 0 0 0 1px rgba(255,255,255,.15);

            border-radius: 50%; opacity: .95;
        }
        .chef-code-cheek.left { left: 5px; }
        .chef-code-cheek.right { right: 5px; }
        .chef-code-smile {
            position: absolute; z-index: 2; left: 21px; bottom: 9px; width: 25px; height: 14px;
            background: linear-gradient(180deg, #fff 0 35%, #fffcf2 36% 45%, #ef2538 46% 100%);
            border: 2px solid #542015; border-top: 0;
            border-radius: 3px 3px 17px 17px; overflow: hidden;
            box-shadow: inset 0 -2px 0 rgba(150,0,20,.13);
        }
        .chef-code-smile::after {
            content: ""; position: absolute; left: 4px; right: 4px; bottom: -3px; height: 7px;
            background: #f43f5e; border-radius: 50% 50% 0 0;
        }
        .chef-code-wave {
            position: absolute; z-index: 6; left: -13px; top: 22px;
            width: 15px; height: 18px;
            background: linear-gradient(135deg, #fff06a 0%, #ffd21b 48%, #f6a900 100%);

            box-shadow: inset 2px 2px 2px rgba(255,255,255,.45), 0 3px 5px rgba(0,0,0,.18);
        }
        .chef-code-wave::before {
            content: ""; position: absolute; left: -2px; top: -11px; width: 5px; height: 14px;
            border-radius: 5px; background: linear-gradient(90deg, #fff06a, #ffd21b); border: 1px solid #f1a600;
            box-shadow: 5px -3px 0 -1px #ffd21b, 5px -3px 0 0 #f1a600, 10px 0 0 -1px #ffd21b, 10px 0 0 0 #f1a600;
        }
        .chef-code-wave::after {
            content: ""; position: absolute; width: 7px; height: 11px; right: -5px; top: 3px;
            background: linear-gradient(135deg, #ffe85a, #ffbd10); border: 1px solid #f1a600;
            border-radius: 8px; transform: rotate(-32deg);
        }
        @keyframes chefWave { from { transform: rotate(24deg); } to { transform: rotate(-29deg); } }
        @keyframes chefFloat { 0%, 100% { translate: 0 0; } 50% { translate: 0 -2px; } }
        .chat-header .chef-code-avatar {
            width: 46px; height: 46px; margin-top: 4px; transform: scale(.96);
        }
        .chat-header .chef-code-hat { left: 11px; top: -5px; width: 24px; height: 13px; }
        .chat-header .chef-code-hat::before { left: -3px; top: -7px; width: 14px; height: 14px; }
        .chat-header .chef-code-hat::after { right: -3px; top: -9px; width: 16px; height: 17px; }
        .chat-header .chef-code-letter { left: 19px; top: -1px; font-size: 10px; line-height: 12px; }

            .chef-code-avatar, .chef-code-wave { animation: none !important; }

<body>

<header>
    <button onclick="goBack()" class="back-btn">← Back</button>
    <span>Chipso Snaxx Cart 🛒</span>
</header>
<div class="min-order-alert" id="minOrderAlert">

        Minimum order price<br>
        <span class="price">₹150</span><br>
        Please add more packets!
    </p>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function loadCart(){
    let tableBody = document.getElementById("cartBody");
    tableBody.innerHTML = "";
    let total = 0;

    if(cart.length === 0) {
        tableBody.innerHTML = "<tr><td colspan='4' style='padding:40px; color: var(--text-sub); font-weight:500;'>Your cart is empty!</td></tr>";
        document.getElementById("grandTotal").innerText = "Total: ₹0";
        return;
    }

    cart.forEach((item, index) => {
        // Minimum quantity check removed; default qty is set to 1 if undefined/low
        if (!item.qty || item.qty < 1) item.qty = 1;
        let row = tableBody.insertRow();
        row.innerHTML = `
        <td>
            <div class="product-cell" style="padding-left: 5px;">
                <img src="${item.img}" class="cart-img">
                <span>${item.name}</span>
            </div>
        </td>
        <td style="font-weight: 700; color: var(--primary-orange);">₹${item.price}</td>
        <td>
            <div class="qty-controls-wrapper">
                <button class="qty-btn" onclick="updateQty(${index}, -1)">-</button>
                <span class="qty-val">${item.qty}</span>
                <button class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
            </div>
        </td>
        <td>
            <button class="remove-btn" onclick="removeItem(${index})">✕</button>
        </td>
        `;
        total += item.price * item.qty;
    });

    localStorage.setItem("cart", JSON.stringify(cart));
    document.getElementById("grandTotal").innerText = "Total: ₹" + total;
}

function updateQty(index, change) {
    // Quantity can go down to 1 (or item can be removed using remove button)
    if (cart[index].qty + change < 1) {
        return;
    }
    cart[index].qty += change;
    saveAndReload();
}

function removeItem(index){
    if(confirm("Remove this item?")) {
        cart.splice(index, 1);
        saveAndReload();
    }
}

function saveAndReload() {
    localStorage.setItem("cart", JSON.stringify(cart));
    loadCart();
}

function goToOrder(){
    if(!cart || cart.length === 0) {
        alert("Your cart is empty!");
        return;
    }

    let totalAmount = cart.reduce((sum, item) => sum + (Number(item.price) * Number(item.qty)), 0);

function renderMainQuestions() {
    const popup = document.getElementById('questionsPopup');
    let html = `<div style="font-size:0.75rem; color:#38bdf8; font-weight:bold; margin-bottom:4px;">Select a question:</div>`;
    for (let key in chatData) {
        html += `<button class="slate-q-btn" onclick="sendDirectQuestion('${key}')">${chatData[key].q}</button>`;
    }
    popup.innerHTML = html;
}
function sendDirectQuestion(key) {
    const item = chatData[key];
    const chatBody = document.getElementById('chatBody');
    const popup = document.getElementById('questionsPopup');
    popup.style.display = 'none';
    const userMsg = document.createElement('div');
    userMsg.className = 'msg-bubble msg-user';
    userMsg.innerText = item.q;
    chatBody.appendChild(userMsg);
    chatBody.scrollTop = chatBody.scrollHeight;
    setTimeout(() => {
        const botMsg = document.createElement('div');
        botMsg.className = 'msg-bubble msg-bot';
        botMsg.innerHTML = item.a + `<br><br><a href="https://wa.me/919744390615?text=${encodeURIComponent('Hi Chipso Foods, I have a query: ' + item.q)}" target="_blank" style="color:#38bdf8; font-weight:bold;">📲 Chat on WhatsApp</a>`;
        chatBody.appendChild(botMsg);
        chatBody.scrollTop = chatBody.scrollHeight;
        renderSubQuestions(key);
    }, 300);
}
function renderSubQuestions(parentKey) {
    const item = chatData[parentKey];
    const popup = document.getElementById('questionsPopup');
    let html = `<div style="font-size:0.75rem; color:#38bdf8; font-weight:bold; margin-bottom:4px;">Related Questions:</div>`;
    item.sub.forEach((subObj) => {
        html += `<button class="slate-q-btn" onclick="sendSubQuestion('${subObj.q.replace(/'/g,"\\'")}', '${subObj.a.replace(/'/g,"\\'")}')">${subObj.q}</button>`;
    });
    html += `<button class="slate-q-btn" onclick="renderMainQuestions()">⬅️ Back</button>`;
    popup.innerHTML = html;
}
function sendSubQuestion(questionText, answerText) {
    const chatBody = document.getElementById('chatBody');
    const popup = document.getElementById('questionsPopup');
    popup.style.display = 'none';
    const userMsg = document.createElement('div');
    userMsg.className = 'msg-bubble msg-user';
    userMsg.innerText = questionText;
    chatBody.appendChild(userMsg);
    chatBody.scrollTop = chatBody.scrollHeight;
    setTimeout(() => {
        const botMsg = document.createElement('div');
        botMsg.className = 'msg-bubble msg-bot';
        botMsg.innerHTML = answerText + `<br><br><a href="https://wa.me/919744390615" target="_blank" style="color:#38bdf8;">📲 WhatsApp Support</a>`;
    }, 300);
}
